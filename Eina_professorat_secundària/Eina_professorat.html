<script type="application/shiny-prerendered" data-context="server">
output$grafic_total <- renderPlot({
  
  req(input$curs_range)
 
  # Filtrar les dades segons els inputs seleccionats 
  dades_filtrades <- panell_tot %>%
    filter(ratio == input$ratio_filter,
           escenari_entrada == input$escenari_entrada_filter,
           escenari_alumnes  == input$escenari_alumnes_filter,
           concertada_privada == input$concertada_filter,
           curs >= input$curs_range[1],
           curs <= input$curs_range[2]) %>% 
    ungroup() %>% 
    mutate(nivell = factor(nivell, levels = c("Infantil i primària", "ESO i batxillerat")))
  
  last_obs <- dades_filtrades %>% 
    filter(curs == max(curs))
    
  
  # Crear el gràfic amb ggplot
  dades_filtrades %>%
    ggplot(aes(x = curs)) +
    geom_line(
      data = dades_filtrades %>% filter(curs >= 2025),
      aes(y = personal_disponible),
      size = 1.5,
      linetype = "dotted",
      color = paleta_ivalua[1]) +
    geom_segment(
      data = last_obs %>% 
        filter(personal_necessari > personal_disponible),
      aes(x = curs, xend = curs,
          y = personal_necessari, yend = personal_disponible),
      color = paleta_ivalua[10],
      size = 1.2) +
    geom_point(
      data = last_obs %>%

<script type="application/shiny-prerendered" data-context="server-extras">
ojs_define <- function(..., .session = shiny::getDefaultReactiveDomain()) {
  quos <- rlang::enquos(...)
  vars <- rlang::list2(...)
  nm <- names(vars)
  if (is.null(nm)) {
    nm <- rep_len("", length(vars))
  }
  mapply(function(q, nm, val) {
    # Infer name, if possible
    if (nm == "") {
      tryCatch({
        nm <- rlang::as_name(q)
      }, error = function(e) {
        code <- paste(collapse = "\n", deparse(rlang::f_rhs(q)))
        stop("ojs_define() could not create a name for the argument: ", code)
      })
    }
    .session$output[[nm]] <- val
    outputOptions(.session$output, nm, suspendWhenHidden = FALSE)
    .session$sendCustomMessage("ojs-export", list(name = nm))
    NULL
  }, quos, nm, vars, SIMPLIFY = FALSE, USE.NAMES = FALSE)
  invisible()
}
</script>
